<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <!-- Transparent status bar: the page background (light or dark) shows through it.
         Safe-area padding keeps content clear of it — see --safe-top. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before first paint: no white flash on a dark phone. Mirrors src/app/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("ledger_crm_theme");
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').content = "%THEME_COLOR_DARK%";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
